# The verification board. THREE JOBS, and the shape is the point.
#
# It was seven: a build gate plus a six-way matrix, one suite per job. Every
# one of those six paid its own checkout, npm ci, browser cache, browser
# install and dev server — about forty seconds of setup — and four of them
# then ran a test lasting four to fourteen seconds. Six jobs also asked
# actions/cache for the SAME key on the same second, and the one that lost
# that race re-fetched the browser's apt font packages at 39.6 kB/s: seven
# minutes and twenty-one seconds, on 2026-09-01, in a fourteen-minute board.
#
# So the setup is paid twice instead of seven times, the apt is gone (see
# .github/actions/stage), and the split is by COST rather than by file:
#
#   build    ten seconds, needs no browser at all
#   suites   the five short ones back to back, one dev server between them
#   world    the long one, alone, because it is the wall clock
#
# The five in `suites` add up to about three and a half minutes of tests,
# which still lands inside world's run, so the board is world plus setup —
# the same wall clock as the matrix, with five fewer machines and none of
# the cache contention that produced the seven-minute step.
name: suites

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE CHEAPEST GATE, AND THE ONE THAT MATTERS MOST: the live site serves
  # COMMITTED bundles, so a build that does not match its source is the v0.46
  # bug — a stale bundle missing whole features while every suite passed
  # against live source — waiting to happen again. No browser, ten seconds.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test fixtures parse cleanly
        run: npm run test:parse
      - name: Committed bundles match the source
        run: |
          npm run build
          if ! git diff --quiet -- index.html assets docs favicon.svg 2>/dev/null; then
            echo "::error::The committed bundles (repo root / docs) do not match a fresh build."
            echo "Run 'npm run build' locally and commit the result — the live site serves the committed files."
            git diff --stat -- index.html assets docs
            exit 1
          fi

  # The five short suites, one after another against one dev server. Their
  # own runtimes are 5s, 4s, 14s, 63s and 98s; a job apiece cost eight times
  # more in setup than any of them cost in tests.
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
      - run: node tests/cadence.mjs
      - run: node tests/gait.mjs
      - run: node tests/sizes.mjs
      - run: node tests/ethogram.mjs
      - run: node tests/forage.mjs

  # ...and the long one on its own, because it IS the board's wall clock.
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
      - run: node tests/world.mjs
